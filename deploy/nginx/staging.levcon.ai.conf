# ═══════════════════════════════════════════════════════════════
#  LEVCON.AI STAGING — NGINX CONFIG
#  Pfad auf VPS: /etc/nginx/sites-available/staging.levcon.ai
# ═══════════════════════════════════════════════════════════════
#
#  Unterschiede zu Production (levcon.ai.conf):
#  - server_name: staging.levcon.ai (kein www-Redirect nötig)
#  - Upstream Port 3003 (statt 3002)
#  - Eigene Rate-Limit-Zone (levcon_staging_api)
#  - X-Robots-Tag: noindex, nofollow (Staging darf nicht in Google)
#  - Eigene SSL-Zertifikate (staging.levcon.ai)
#  - Eigene Log-Files (getrennt von Production)
#
#  State-of-the-Art:
#  - HTTP/2
#  - Modern SSL (TLS 1.2/1.3)
#  - HSTS (1 Jahr + preload)
#  - Security Headers (X-Frame, X-Content-Type, Referrer-Policy, CSP)
#  - gzip
#  - Reverse Proxy zu Next.js Staging (Port 3006)
#    (3003-3005 durch andere Services belegt, 3006 frei)
#  - Rate Limiting für API

# Rate Limiting Zone (gegen Brute-Force) — eigene Zone für Staging
limit_req_zone $binary_remote_addr zone=levcon_staging_api:10m rate=10r/s;

# Upstream Next.js Staging (Port 3006)
upstream levcon_staging_nextjs {
    server 127.0.0.1:3006;
    keepalive 32;
}

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name staging.levcon.ai;

    # ACME Challenge (für certbot --webroot Renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Alles andere → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.levcon.ai;

    # ── SSL ────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/staging.levcon.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.levcon.ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/staging.levcon.ai/chain.pem;

    # Modern SSL Config (Mozilla Intermediate, 2024)
    ssl_session_timeout 1d;
    ssl_session_cache shared:LEVCON_STAGING_SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ───────────────────────────────────────
    # HSTS — auch für Staging (SSL soll erzwungen werden)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ── STAGING-SPEZIFISCHE HEADER ─────────────────────────────
    # WICHTIG: X-Robots-Tag verhindert, dass Staging in Google indexiert wird.
    # Next.js setzt noindex-meta-tag zusätzlich via proxy.ts (Environment-basiert).
    # Doppelte Absicherung: Header + Meta-Tag.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # ── Logs (eigene Files für Staging) ────────────────────────
    access_log /var/log/nginx/staging.levcon.ai.access.log;
    error_log /var/log/nginx/staging.levcon.ai.error.log warn;

    # ── ACME Challenge (auch über HTTPS) ───────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # ── Static Assets (Next.js _next/static) ───────────────────
    location /_next/static/ {
        proxy_pass http://levcon_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    # ── Next.js Image Optimization ─────────────────────────────
    location /_next/image {
        proxy_pass http://levcon_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Favicon & static files ─────────────────────────────────
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot|txt|xml|webmanifest)$ {
        proxy_pass http://levcon_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── API Rate Limiting ──────────────────────────────────────
    location /api/ {
        limit_req zone=levcon_staging_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://levcon_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Main Reverse Proxy (Next.js Staging) ───────────────────
    location / {
        proxy_pass http://levcon_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # ── Gzip ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2
        application/font-woff2;

    client_max_body_size 10m;
}
