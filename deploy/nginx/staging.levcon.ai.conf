# ═══════════════════════════════════════════════════════════════
#  LEVCON.AI STAGING — NGINX CONFIG (mit Access Control)
#  Pfad auf VPS: /etc/nginx/sites-available/staging.levcon.ai
# ═══════════════════════════════════════════════════════════════
#
#  Unterschiede zu Production (levcon.ai.conf):
#  - server_name: staging.levcon.ai
#  - Upstream Port 3006 (Production: 3002)
#  - Eigene Rate-Limit-Zone (levcon_staging_api)
#  - X-Robots-Tag: noindex, nofollow (keine Google-Indexierung)
#  - Eigene SSL-Zertifikate (staging.levcon.ai)
#  - Eigene Log-Files (getrennt von Production)
#
#  STAGING ACCESS CONTROL (Defense in Depth):
#  - Staging ist NICHT öffentlich — Basic Auth für Browser-Zugriff
#  - API-Endpunkte (/api/*) sind NICHT durch Basic Auth geschützt,
#    sondern durch LEVCON_INTERNAL_API_KEY (X-Levcon-Api-Key Header).
#    So kann n8n weiterhin auf die Staging-API zugreifen.
#  - Static Assets (_next/static, images, favicon) sind frei zugänglich
#    (brechen sonst das Browser-Erlebnis nach Basic-Auth-Login).
#  - htpasswd-File auf VPS: /etc/nginx/.htpasswd.levcon-staging
#    Erstellen: sudo htpasswd -c /etc/nginx/.htpasswd.levcon-staging <user>
#
#  State-of-the-Art:
#  - HTTP/2, modern SSL (TLS 1.2/1.3)
#  - HSTS (1 Jahr + preload)
#  - Security Headers (CSP, X-Frame, X-Content-Type, Referrer-Policy)
#  - gzip
#  - Rate Limiting für API

# Rate Limiting Zone (gegen Brute-Force) — eigene Zone für Staging
limit_req_zone $binary_remote_addr zone=levcon_staging_api:10m rate=10r/s;

# Upstream Next.js Staging (Port 3006)
upstream levcon_staging_nextjs {
    server 127.0.0.1:3006;
    keepalive 32;
}

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name staging.levcon.ai;

    # ACME Challenge (für certbot --webroot Renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Alles andere → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.levcon.ai;

    # ── SSL ────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/staging.levcon.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.levcon.ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/staging.levcon.ai/chain.pem;

    # Modern SSL Config (Mozilla Intermediate, 2024)
    ssl_session_timeout 1d;
    ssl_session_cache shared:LEVCON_STAGING_SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ───────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ── STAGING-SPEZIFISCHE HEADER ─────────────────────────────
    # X-Robots-Tag verhindert Google-Indexierung (zusätzlich zu Next.js proxy.ts)
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # ── Logs (eigene Files für Staging) ────────────────────────
    access_log /var/log/nginx/staging.levcon.ai.access.log;
    error_log /var/log/nginx/staging.levcon.ai.error.log warn;

    # ── ACME Challenge (auch über HTTPS) ───────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        # Keine Basic Auth für ACME Challenge (sonst Renewal schlägt fehl)
    }

    # ── Static Assets (frei zugänglich, kein Basic Auth) ───────
    # WICHTIG: Static Assets müssen ohne Basic Auth zugänglich sein,
    # sonst brechen sie das Browser-Erlebnis nach Basic-Auth-Login.
    # Sie sind ohnehin nicht sensitiv (nur CSS, JS, Fonts).
    location /_next/static/ {
        proxy_pass http://levcon_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    # ── Next.js Image Optimization (frei zugänglich) ───────────
    location /_next/image {
        proxy_pass http://levcon_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Favicon & static files (frei zugänglich) ────────────────
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot|webmanifest)$ {
        proxy_pass http://levcon_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── robots.txt + sitemap.xml (frei zugänglich — sonst Google checkt nicht) ──
    location = /robots.txt {
        proxy_pass http://levcon_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    # ── API Rate Limiting (KEINE Basic Auth — API-Key schützt) ──
    # WICHTIG: API-Endpunkte sind NICHT durch Basic Auth geschützt!
    # Grund: n8n muss via API auf Staging zugreifen können.
    # Schutz: LEVCON_INTERNAL_API_KEY via X-Levcon-Api-Key Header.
    # Diese API-Endpunkte geben 401 zurück wenn kein/ungültiger Key.
    location /api/ {
        limit_req zone=levcon_staging_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://levcon_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── Main Reverse Proxy (mit Basic Auth) ────────────────────
    # ALLES ANDERE (also /, /ai-news, /ki-schulungen, etc.) ist
    # durch Basic Auth geschützt. User muss Credentials eingeben.
    location / {
        auth_basic "Levcon Staging — Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd.levcon-staging;

        proxy_pass http://levcon_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # ── Gzip ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2
        application/font-woff2;

    client_max_body_size 10m;
}
